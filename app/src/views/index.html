<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Feedback System — Scenario75 Cyber Range</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { color: #1a1a2e; }
    form { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    textarea { width: 100%; min-height: 120px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { margin-top: 12px; padding: 10px 24px; background: #1a1a2e; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #16213e; }
    #status { margin-top: 16px; padding: 10px; border-radius: 4px; display: none; }
    #status.success { background: #d4edda; color: #155724; display: block; }
    #status.error   { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>
  <h1>Admin Feedback System</h1>
  <p>Submit your feedback below. All submissions are reviewed by the administration team.</p>

  <form id="feedbackForm">
    <label for="message"><strong>Feedback Message</strong></label><br />
    <textarea id="message" name="message" placeholder="Enter your feedback here..." required></textarea>
    <br />
    <button type="submit">Submit Feedback</button>
  </form>

  <div id="status" role="alert"></div>

  <script>
    /**
     * SAFETY NOTE: User input is displayed using textContent, NEVER innerHTML.
     * XSS vulnerability is NOT implemented at this scaffolding stage.
     * TODO (CTF IMPLEMENTATION STAGE): Introduce controlled innerHTML rendering
     *      inside the isolated cyber-range only.
     */
    const form = document.getElementById('feedbackForm');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = document.getElementById('message').value;

      statusEl.className = '';
      statusEl.style.display = 'none';

      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();

        if (res.ok && data.success) {
          // Safe: use textContent, not innerHTML
          statusEl.textContent = 'Feedback submitted successfully. Thank you.';
          statusEl.className = 'success';
          form.reset();
        } else {
          statusEl.textContent = 'Submission failed: ' + (data.error || 'Unknown error');
          statusEl.className = 'error';
        }
      } catch (err) {
        statusEl.textContent = 'Network error. Please try again.';
        statusEl.className = 'error';
      }
    });
  </script>
</body>
</html>
