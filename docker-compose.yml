version: '3.8'

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      # IN_CONTAINER=true tells the app it is running inside Docker and may
      # bind to 0.0.0.0 so that Nginx (in a sibling container on the same
      # bridge network) can reach it via the service name "app".
      # The app port is NOT published to the host — only exposed within the
      # Docker bridge — so 0.0.0.0 here is safe (see app/src/config/index.js).
      - IN_CONTAINER=true
      - PORT=3075
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - APP_NAME=${APP_NAME:-Scenario75 Cyber Range}
    # expose makes the port reachable only by other containers on the same
    # Docker network.  It does NOT publish the port to the host.
    expose:
      - "3075"
    networks:
      - cyberrange
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3075/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    # Only Nginx is published — bound to the host loopback only.
    # No other port is reachable from outside the host.
    ports:
      - "127.0.0.1:3075:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - cyberrange
    restart: unless-stopped

networks:
  cyberrange:
    driver: bridge
    # internal: false allows the containers to make outbound calls if needed
    # (e.g. for package installs during build).  The host-side exposure is
    # controlled exclusively by the `ports` / `expose` configuration above.
    internal: false
